[build]
  publish = "."
  functions = "netlify/functions"

[[redirects]]
  from = "/api/records"
  to = "/.netlify/functions/records"
  status = 200

[[redirects]]
  from = "/api/catalogs"
  to = "/.netlify/functions/catalogs"
  status = 200

[[redirects]]
  from = "/api/survey-results"
  to = "/.netlify/functions/survey-results"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; connect-src 'self'; font-src 'self' https://fonts.gstatic.com; form-action 'self'; frame-ancestors 'none'; img-src 'self' data:; object-src 'none'; script-src 'self'; style-src 'self' https://fonts.googleapis.com"
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Resource-Policy = "same-origin"
    Permissions-Policy = "camera=(), geolocation=(), microphone=()"
    Referrer-Policy = "no-referrer"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
